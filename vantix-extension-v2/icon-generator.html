<!DOCTYPE html>
<html>
<head>
    <title>Vantix Icon Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #070A0F; color: #fff; }
        canvas { border: 1px solid #333; margin: 10px; background: #070A0F; }
    </style>
</head>
<body>
    <h2>Vantix PNG Icon Generator</h2>
    <p>Please click the button below to generate and download the required PNG files (16, 32, 48, 128) based on your SVG.</p>
    <button id="downloadBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Download PNG Icons</button>
    <div id="canvases"></div>

    <script>
        // The exact Vantix SVG markup from vantix-logo.svg
        const svgData = `
        <svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="v_grad_gen" x1="50" y1="25" x2="50" y2="95" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00F0FF"/>
              <stop offset="1" stop-color="#0066FF"/>
            </linearGradient>
          </defs>
          <path d="M22 28C22 28 29 25 38 28L50 78L62 28C71 25 78 28 78 28L50 95L22 28Z" fill="url(#v_grad_gen)"/>
          <path d="M65 38L58 58" stroke="#051226" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
          <circle cx="56" cy="64" r="4.5" stroke="#051226" stroke-width="3.5" opacity="0.8"/>
        </svg>
        `;

        const sizes = [16, 32, 48, 128];
        const paddingRatio = 0.15; // 15% padding
        const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(blob);
        
        const img = new Image();
        img.crossOrigin = "Anonymous";
        
        img.onload = function() {
            const container = document.getElementById('canvases');
            const canvases = [];
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                container.appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                const padding = size * paddingRatio;
                const innerSize = size - (padding * 2);
                
                ctx.drawImage(img, padding, padding, innerSize, innerSize);
                canvases.push({ size: size, element: canvas });
            });
            
            document.getElementById('downloadBtn').addEventListener('click', () => {
                canvases.forEach(c => {
                    const link = document.createElement('a');
                    link.download = `icon${c.size}.png`;
                    link.href = c.element.toDataURL('image/png');
                    link.click();
                });
                alert('Downloaded! Please move the downloaded PNG files into the "icons" folder.');
            });
        };
        img.src = blobURL;
    </script>
</body>
</html>
