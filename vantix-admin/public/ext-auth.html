<!DOCTYPE html>
<html>
<head>
    <title>Vantix Secure Login</title>
    <style>
        body { 
            background: #070A0F; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }
        .container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        .logo { width: 60px; height: 60px; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .subtitle { font-size: 14px; color: #a0aec0; margin-bottom: 30px; }
        .btn { 
            padding: 14px 28px; 
            background: #25E6D9; 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 16px;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn:hover { background: #1fcfc3; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .status { margin-top: 20px; font-size: 14px; color: #25E6D9; }
        .error { color: #fc8181; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Vantix Security</div>
        <div class="subtitle">Complete your login to sync with the browser extension.</div>
        
        <button id="login-btn" class="btn">Continue to Login</button>
        
        <div id="status" class="status" style="display:none;"></div>
        <div id="error" class="error" style="display:none;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDajd1mzoWG1bz2_dlIQs5prPGms7FU8Jg",
            authDomain: "gen-lang-client-0119077364.firebaseapp.com",
            projectId: "gen-lang-client-0119077364",
            storageBucket: "gen-lang-client-0119077364.firebasestorage.app",
            messagingSenderId: "1204185065",
            appId: "1:1204185065:web:e3b9f9d1455417ab954d78"
        };

        const EXTENSION_ID = "fhohiejeobmkadffkmblpnnakcfkhadh";

        if (!window.firebase.apps.length) {
            window.firebase.initializeApp(firebaseConfig);
        }
        const auth = window.firebase.auth();

        const loginBtn = document.getElementById('login-btn');
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');

        loginBtn.onclick = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const providerType = urlParams.get('provider');
            
            loginBtn.disabled = true;
            loginBtn.textContent = "Authenticating...";
            statusEl.style.display = "block";
            statusEl.textContent = "Please complete the login in the popup window...";
            errorEl.style.display = "none";

            try {
                let provider = providerType === 'github' 
                    ? new firebase.auth.GithubAuthProvider() 
                    : new firebase.auth.GoogleAuthProvider();

                const result = await auth.signInWithPopup(provider);
                const token = await result.user.getIdToken();

                statusEl.textContent = "Success! Syncing with Vantix...";

                if (window.chrome && window.chrome.runtime && window.chrome.runtime.sendMessage) {
                    window.chrome.runtime.sendMessage(EXTENSION_ID, { 
                        type: "SYNC_AUTH", 
                        token, 
                        email: result.user.email,
                        userType: providerType === 'github' || providerType === 'google' ? urlParams.get('userType') : 'company'
                    }, (response) => {
                        if (window.chrome.runtime.lastError) {
                            throw new Error("Extension sync failed.");
                        } else {
                            statusEl.textContent = "Logged in! Closing window...";
                            setTimeout(() => window.close(), 1000);
                        }
                    });
                }
            } catch (err) {
                console.error(err);
                loginBtn.disabled = false;
                loginBtn.textContent = "Continue to Login";
                statusEl.style.display = "none";
                errorEl.style.display = "block";
                errorEl.textContent = "Login Failed: " + (err.message || err.code);
            }
        };
    </script>
</body>
</html>
